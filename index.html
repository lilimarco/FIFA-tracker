    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0a0a0f; overflow-x: hidden; }

    ::-webkit-scrollbar-track { background: #111; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
    input::placeholder { color: #555; }
    input:focus { border-color: #555 !important; outline: none; }
    textarea { outline: none; resize: vertical; font-family: 'Courier New', monospace; }
    textarea::placeholder { color: #555; }
    textarea:focus { border-color: #f39c12 !important; }

    .match-row { transition: background 0.12s; }
    .match-row:hover { background: #14141c !important; }

    /* Winner buttons */
    .w-btn {
      flex: 1; background: transparent; border: 1px solid #252530; color: #484858;
      font-size: 10px; font-family: 'Courier New', monospace; cursor: pointer;
      border-radius: 2px; padding: 4px 2px; transition: all 0.12s; letter-spacing: 0.5px;
    }
    .w-btn:hover { border-color: #444; color: #888; }
    .w-btn.wh { border-color: #2ecc71 !important; color: #2ecc71 !important; background: rgba(46,204,113,0.1) !important; font-weight: 700; }
    .w-btn.wd { border-color: #94a3b8 !important; color: #94a3b8 !important; background: rgba(148,163,184,0.08) !important; font-weight: 700; }
    .w-btn.wa { border-color: #e74c3c !important; color: #e74c3c !important; background: rgba(231,76,60,0.1) !important; font-weight: 700; }

    /* Reaction buttons */
    .r-btn {
      background: transparent; border: 1px solid #252530; color: #484858;
      padding: 3px 5px; font-size: 11px; font-family: 'Courier New', monospace;
      cursor: pointer; border-radius: 3px; display: inline-flex; align-items: center;
      gap: 3px; transition: all 0.12s; white-space: nowrap; flex-shrink: 0;
    }
    .r-btn:hover { transform: scale(1.08); border-color: #444; }
    .r-btn.rl { border-color: #2ecc71; color: #2ecc71; background: rgba(46,204,113,0.1); }
    .r-btn.rd { border-color: #e74c3c; color: #e74c3c; background: rgba(231,76,60,0.1); }

    /* Edit button */
    .e-btn {
      background: transparent; border: 1px solid #252530; color: #484858;
      width: 27px; height: 27px; font-size: 12px; cursor: pointer; border-radius: 3px;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s; flex-shrink: 0;
    }
    .e-btn:hover { border-color: #f39c12; color: #f39c12; }
    .e-btn.ea { border-color: #f39c12 !important; color: #f39c12 !important; background: rgba(243,156,18,0.1) !important; }

    /* Checkbox */
    .chk {
      width: 22px; height: 22px; border-radius: 3px; flex-shrink: 0; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; color: #000; font-weight: 900; transition: all 0.15s;
    }

    /* ── WINDOW WIDTH HOOK ─────────────────────────────────────── */
    function useVW() {
      const [w, setW] = useState(window.innerWidth);
      useEffect(() => {
        const h = () => setW(window.innerWidth);
        window.addEventListener('resize', h);
        return () => window.removeEventListener('resize', h);
      }, []);
      return w;
    }

      const ls = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };

      const [search,       setSearch]       = useState('');

      const vw       = useVW();
      const isMobile = vw < 640;

      useEffect(() => { try{localStorage.setItem('wc26_done',  JSON.stringify(done))}      catch{} }, [done]);
      useEffect(() => { try{localStorage.setItem('wc26_react', JSON.stringify(reactions))} catch{} }, [reactions]);
      useEffect(() => { try{localStorage.setItem('wc26_win',   JSON.stringify(winners))}   catch{} }, [winners]);
      useEffect(() => { try{localStorage.setItem('wc26_cmts',  JSON.stringify(comments))}  catch{} }, [comments]);

      const toggle = id => setDone(d => d.includes(id) ? d.filter(x => x !== id) : [...d, id]);

      const pickWinner = (id, val) => setWinners(w => {
        if (w[id] === val) { const n = {...w}; delete n[id]; return n; }
        return {...w, [id]: val};
      });

      const react = (id, type) => {
        setReactions(r => {
          const c = r[id] || {likes: 0, dislikes: 0, uv: null};
          let {likes, dislikes, uv} = c;
          if (type === 'like') {
            if (uv === 'like')    { likes--;    uv = null;    }
            else                  { if (uv === 'dislike') dislikes--; likes++;    uv = 'like';    }
          } else {
            if (uv === 'dislike') { dislikes--; uv = null;    }
            else                  { if (uv === 'like')    likes--;    dislikes++; uv = 'dislike'; }
          }
          return {...r, [id]: {likes, dislikes, uv}};
        });
      };

      /* Edit mode helpers */
      const enterEdit = id => { setEditId(id); setCommentDraft(comments[id] || ''); };
      const exitEdit  = ()  => { setEditId(null); setCommentDraft(''); };

      const saveComment = id => {
        const trimmed = commentDraft.trim();
        setComments(c => trimmed ? {...c, [id]: trimmed} : (() => { const n = {...c}; delete n[id]; return n; })());
        setSavedFlash(id);
        setTimeout(() => setSavedFlash(f => f === id ? null : f), 1800);
      };

      const removeComment = id => {
        setComments(c => { const n = {...c}; delete n[id]; return n; });
        setCommentDraft('');
      };

      /* Filtering */
      const filtered = matches.filter(m => {
        if (filter !== 'All' && m.stage !== filter) return false;
        const q = search.toLowerCase();
        return !q || [m.home, m.away, m.date, m.stage].some(s => s.toLowerCase().includes(q));
      });

      const grouped = {};
      filtered.forEach(m => { (grouped[m.stage] = grouped[m.stage] || []).push(m); });

      const total  = matches.length;
      const played = done.length;
      const pct    = Math.round(played / total * 100);
      const isGroupsActive = filter.startsWith('Group');
      const isKoActive     = !isGroupsActive && filter !== 'All';

      /* ── RENDER ONE MATCH ROW ──────────────────────────────── */
      const renderMatch = m => {
        const isDone    = done.includes(m.id);
        const w         = winners[m.id]   || null;
        const r         = reactions[m.id] || {likes: 0, dislikes: 0, uv: null};
        const cmt       = comments[m.id]  || '';
        const isEditing = editId === m.id;
        const sc        = stageColors[m.stage];

        const hf = getFlag(m.home);
        const af = getFlag(m.away);
        const hn = getName(m.home);
        const an = getName(m.away);

        /* Team name colors */
        const homeC = isDone ? '#383848'
          : w === 'home' ? '#f39c12'
          : w === 'away' ? '#383848'
          : w === 'draw' ? '#8899aa'
          : '#dde0ea';
        const awayC = isDone ? '#383848'
          : w === 'away' ? '#f39c12'
          : w === 'home' ? '#383848'
          : w === 'draw' ? '#8899aa'
          : '#dde0ea';

        const rowBg = isEditing ? '#12121e' : isDone ? '#0c180c' : '#111118';
        const rowBd = isEditing ? '#2a2a44' : isDone ? '#1d381d' : '#1a1a26';

        /* ── Shared elements ── */
        const checkEl = (
          <div onClick={e => {e.stopPropagation(); toggle(m.id);}}
            className="chk"
            style={{
              background: isDone ? '#2ecc71' : 'transparent',
              border: `2px solid ${isDone ? '#2ecc71' : '#333'}`
            }}>
            {isDone ? '✓' : ''}
          </div>
        );

        const timeEl = (
          <div style={{flexShrink: 0}}>
            <div style={{fontSize: 12, color: '#f39c12', fontWeight: 700, lineHeight: 1.3}}>{m.kst}</div>
            <div style={{fontSize: 8,  color: '#555',    lineHeight: 1.3, letterSpacing: 0.5}}>KST</div>
          </div>
        );

        /* Winner buttons — locked when not in edit mode, active state still visible */
        const winnerEl = (
          <div style={{display: 'flex', gap: 2, pointerEvents: isEditing ? 'auto' : 'none'}}
               onClick={e => e.stopPropagation()}>
            {[['home','H','wh'], ['draw','D','wd'], ['away','A','wa']].map(([val, label, cls]) => (
              <button key={val}
                className={`w-btn${w === val ? ` ${cls}` : ''}`}
                onClick={() => pickWinner(m.id, val)}
                title={isEditing ? `Mark ${val} win` : 'Press ✏️ to edit'}
                style={{
                  opacity: isEditing ? 1 : (w === val ? 0.7 : 0.14),
                  cursor: isEditing ? 'pointer' : 'default'
                }}>
                {label}
              </button>
            ))}
          </div>
        );

        /* Reaction buttons — locked when not in edit mode */
        const reactEl = (
          <div style={{display: 'flex', gap: 3, flexShrink: 0, pointerEvents: isEditing ? 'auto' : 'none'}}
               onClick={e => e.stopPropagation()}>
            {[['like','👍','rl', r.likes], ['dislike','👎','rd', r.dislikes]].map(([type, emoji, cls, count]) => (
              <button key={type}
                className={`r-btn${r.uv === type ? ` ${cls}` : ''}`}
                onClick={() => react(m.id, type)}
                title={isEditing ? (type === 'like' ? 'Like this match' : 'Dislike') : 'Press ✏️ to edit'}
                style={{
                  opacity: isEditing ? 1 : (r.uv === type ? 0.7 : 0.18),
                  cursor: isEditing ? 'pointer' : 'default'
                }}>
                {emoji} <span style={{fontSize: 9}}>{count}</span>
              </button>
            ))}
          </div>
        );

        const badgeEl = (
          <div style={{
            fontSize: 9, padding: '2px 5px', borderRadius: 2, flexShrink: 0,
            background: sc + '20', color: sc, border: `1px solid ${sc}40`,
            letterSpacing: 0.5, textAlign: 'center', lineHeight: 1.6, whiteSpace: 'nowrap'
          }}>
            {m.stage.replace('Group ', 'G').replace('Round of ', 'R')
              .replace('Quarterfinal', 'QF').replace('Semifinal', 'SF').replace('🏆 ', '')}
          </div>
        );

        const editEl = (
          <button className={`e-btn${isEditing ? ' ea' : ''}`}
            title={isEditing ? 'Close edit mode' : 'Edit this match'}
            onClick={e => {e.stopPropagation(); isEditing ? exitEdit() : enterEdit(m.id);}}>
            ✏️
          </button>
        );

        /* Saved comment — always visible below the row when a comment exists (view mode) */
        const commentDisplay = !isEditing && cmt && (
          <div style={{
            display: 'flex', alignItems: 'flex-start', gap: 7, padding: '5px 16px 8px',
            borderTop: `1px solid ${rowBd}`, background: 'rgba(243,156,18,0.03)'
          }}>
            <span style={{fontSize: 13, color: '#f39c12', flexShrink: 0, marginTop: 1}}>💬</span>
            <span style={{
              fontSize: 11, color: '#7a7a9a', lineHeight: 1.6,
              fontStyle: 'italic', whiteSpace: 'pre-wrap', wordBreak: 'break-word', flex: 1
            }}>{cmt}</span>
          </div>
        );

        /* Comment edit panel — shown in edit mode */
        const commentPanel = isEditing && (
          <div style={{
            padding: isMobile ? '8px 10px 12px' : '8px 16px 12px',
            borderTop: `1px solid ${rowBd}`,
            background: '#0e0e18'
          }}>
            <div style={{display: 'flex', alignItems: 'center', gap: 6, marginBottom: 7}}>
              <span style={{fontSize: 13, color: '#f39c12'}}>💬</span>
              <span style={{fontSize: 9, color: '#555', letterSpacing: 1.5, textTransform: 'uppercase'}}>Comment</span>
              {cmt && <span style={{fontSize: 9, color: '#2ecc7188', marginLeft: 4}}>· saved</span>}
            </div>
            <textarea
              placeholder="Write your note for this match..."
              value={commentDraft}
              onChange={e => setCommentDraft(e.target.value)}
              onClick={e => e.stopPropagation()}
              rows={2}
              style={{
                width: '100%', background: '#0a0a14',
                border: '1px solid #2a2a3a', borderRadius: 3,
                color: '#ccc', padding: '7px 10px', fontSize: 12,
                display: 'block', userSelect: 'text'
              }}
            />
            <div style={{display: 'flex', gap: 7, marginTop: 8, alignItems: 'center'}}>
              <button
                onClick={e => {e.stopPropagation(); saveComment(m.id);}}
                style={{
                  background: savedFlash === m.id ? '#1a3a1a' : '#141e14',
                  border: `1px solid ${savedFlash === m.id ? '#2ecc71' : '#2a5a2a'}`,
                  color: savedFlash === m.id ? '#2ecc71' : '#4a9a4a',
                  padding: '5px 16px', borderRadius: 3, fontSize: 11,
                  fontFamily: "'Courier New', monospace", cursor: 'pointer',
                  letterSpacing: 0.5, transition: 'all 0.2s'
                }}>
                {savedFlash === m.id ? '✓ Saved!' : '💾 Save'}
              </button>
              {cmt && (
                <button
                  onClick={e => {e.stopPropagation(); removeComment(m.id);}}
                  style={{
                    background: 'transparent', border: '1px solid #3a2020', color: '#6a3a3a',
                    padding: '5px 12px', borderRadius: 3, fontSize: 11,
                    fontFamily: "'Courier New', monospace", cursor: 'pointer', letterSpacing: 0.5
                  }}>
                  ✕ Remove
                </button>
              )}
              <span style={{marginLeft: 'auto', fontSize: 9, color: '#2a2a3a', letterSpacing: 0.5}}>press ✏️ to close</span>
            </div>
          </div>
        );

        /* ── MOBILE layout (< 640px) ── */
        if (isMobile) {
          return (
            <div key={m.id} className="match-row"
              style={{background: rowBg, borderBottom: `1px solid ${rowBd}`, opacity: isDone ? 0.65 : 1, marginBottom: 1,
                      borderLeft: isEditing ? '2px solid #f39c1266' : '2px solid transparent'}}>

              {/* Row 1: check + time + teams + edit */}
              <div style={{display: 'flex', alignItems: 'center', gap: 7, padding: '8px 10px'}}>
                {checkEl}
                {timeEl}
                <div style={{flex: 1, minWidth: 0, textAlign: 'center'}}>
                  <div style={{display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 4, minWidth: 0}}>
                    <span style={{fontSize: 12, fontWeight: 700, color: homeC, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', textDecoration: isDone ? 'line-through' : 'none'}}>
                      {hn} {hf}
                    </span>
                    <span style={{fontSize: 9, color: '#333', flexShrink: 0}}>vs</span>
                    <span style={{fontSize: 12, fontWeight: 700, color: awayC, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', textDecoration: isDone ? 'line-through' : 'none'}}>
                      {af} {an}
                    </span>
                  </div>
                  <div style={{fontSize: 9, color: '#3a3a4a', marginTop: 2, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis'}}>
                    {m.date} · {m.venue}
                  </div>
                </div>
                {editEl}
              </div>

              {/* Row 2: winner + reactions + badge */}
              <div style={{display: 'flex', alignItems: 'center', gap: 7, padding: '0 10px 8px', paddingLeft: 46}}>
                {winnerEl}
                {reactEl}
                <div style={{marginLeft: 'auto'}}>{badgeEl}</div>
              </div>

              {/* Persistent comment (view mode) */}
              {commentDisplay}

              {/* Comment editor (edit mode) */}
              {commentPanel}
            </div>
          );
        }

        /* ── DESKTOP / TABLET layout (≥ 640px) ── */
        return (
          <div key={m.id} className="match-row"
            style={{background: rowBg, borderBottom: `1px solid ${rowBd}`, opacity: isDone ? 0.65 : 1, marginBottom: 1,
                    borderLeft: isEditing ? '3px solid #f39c1266' : '3px solid transparent'}}>

            <div style={{
              display: 'grid',
              gridTemplateColumns: '36px 56px 1fr 114px 1fr 96px 24px 52px 32px',
              alignItems: 'center',
              gap: '0 6px',
              padding: '9px 16px 9px 13px',
              width: '100%'
            }}>

              {/* 1. Checkbox */}
              <div style={{display: 'flex', justifyContent: 'center'}}>{checkEl}</div>

              {/* 2. Time */}
              {timeEl}

              {/* 3. Home team — right-aligned, flag on right */}
              <div style={{textAlign: 'right', overflow: 'hidden', paddingRight: 4}}>
                <div style={{fontSize: 13, fontWeight: 700, color: homeC, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis', textDecoration: isDone ? 'line-through' : 'none'}}>
                  {hn} {hf}
                </div>
                <div style={{fontSize: 9, color: '#333', marginTop: 1, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis'}}>
                  {m.date} · {m.venue}
                </div>
              </div>

              {/* 4. Winner selector */}
              {winnerEl}

              {/* 5. Away team — left-aligned, flag on left */}
              <div style={{overflow: 'hidden', paddingLeft: 4}}>
                <div style={{fontSize: 13, fontWeight: 700, color: awayC, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis', textDecoration: isDone ? 'line-through' : 'none'}}>
                  {af} {an}
                </div>
              </div>

              {/* 6. Reactions */}
              {reactEl}

              {/* 7. Comment indicator */}
              <div style={{display: 'flex', alignItems: 'center', justifyContent: 'center'}}>
                <span style={{
                  fontSize: 13, cursor: 'default', transition: 'opacity 0.2s',
                  opacity: cmt ? (isEditing ? 1 : 0.5) : (isEditing ? 0.35 : 0),
                  color: '#f39c12'
                }}>💬</span>
              </div>

              {/* 8. Stage badge */}
              {badgeEl}

              {/* 9. Edit button */}
              <div style={{display: 'flex', justifyContent: 'center'}}>{editEl}</div>
            </div>

            {/* Persistent comment display (view mode) */}
            {commentDisplay}

            {/* Comment edit panel (edit mode) */}
            {commentPanel}
          </div>
        );
      };

      /* ── RENDER ─────────────────────────────────────────────── */
      return (
        <div style={{fontFamily: "'Courier New', Courier, monospace", background: '#0a0a0f', minHeight: '100vh', color: '#e8e8e8', userSelect: 'none'}}>

          {/* ── HEADER ── */}
          <div style={{
            background: 'linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%)',
            padding: isMobile ? '16px 12px 14px' : '20px 16px 16px',
            borderBottom: '2px solid #f39c12',
            position: 'sticky', top: 0, zIndex: 100
          }}>
            <div style={{maxWidth: 1600, margin: '0 auto'}}>

              {/* Title + percentage */}
              <div style={{display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 10}}>
                <div>
                  <div style={{fontSize: 10, letterSpacing: 4, color: '#f39c12', textTransform: 'uppercase', marginBottom: 1}}>FIFA</div>
                  <div style={{fontSize: isMobile ? 17 : 22, fontWeight: 900, letterSpacing: 1, color: '#fff'}}>WORLD CUP 2026</div>
                  <div style={{fontSize: 9, color: '#aaa', letterSpacing: 2}}>KST MATCH TRACKER · 104 GAMES</div>
                </div>
                <div style={{textAlign: 'right'}}>
                  <div style={{fontSize: isMobile ? 24 : 30, fontWeight: 900, color: '#f39c12'}}>{pct}%</div>
                  <div style={{fontSize: 10, color: '#aaa'}}>{played}/{total} played</div>
                </div>
              </div>

              {/* Progress bar */}
              <div style={{background: '#1a1a2e', borderRadius: 2, height: 5, marginBottom: 12, border: '1px solid #333'}}>
                <div style={{background: 'linear-gradient(90deg, #f39c12, #e74c3c)', height: '100%', width: `${pct}%`, borderRadius: 2, transition: 'width 0.3s'}} />
              </div>

              {/* Search */}
              <input
                placeholder="Search team or date..."
                value={search}
                onChange={e => setSearch(e.target.value)}
                style={{
                  width: '100%', background: '#0d0d1a', border: '1px solid #333', borderRadius: 4,
                  color: '#e8e8e8', padding: '7px 12px', fontSize: 12, fontFamily: 'inherit',
                  boxSizing: 'border-box', marginBottom: 10, outline: 'none', userSelect: 'text'
                }}
              />

              {/* Stage filter pills */}
              <div style={{display: 'flex', gap: 5, overflowX: 'auto', paddingBottom: 2}}>
                {['All', 'Groups', 'Knockout'].map(f => {
                  const active = (f === 'All' && filter === 'All') || (f === 'Groups' && isGroupsActive) || (f === 'Knockout' && isKoActive);
                  return (
                    <button key={f}
                      onClick={() => setFilter(f === 'Groups' ? 'Group A' : f === 'Knockout' ? 'Round of 32' : 'All')}
                      style={{
                        background: active ? '#f39c12' : '#1a1a2e', color: active ? '#000' : '#aaa',
                        border: '1px solid #333', borderRadius: 3, padding: '4px 10px',
                        fontSize: 10, fontFamily: 'inherit', cursor: 'pointer', whiteSpace: 'nowrap', letterSpacing: 1
                      }}>
                      {f.toUpperCase()}
                    </button>
                  );
                })}
                {stageOrder.map(s => (
                  <button key={s} onClick={() => setFilter(s)} style={{
                    background: filter === s ? stageColors[s] : '#1a1a2e',
                    color: filter === s ? '#fff' : '#666',
                    border: `1px solid ${filter === s ? stageColors[s] : '#333'}`,
                    borderRadius: 3, padding: '4px 10px', fontSize: 10, fontFamily: 'inherit',
                    cursor: 'pointer', whiteSpace: 'nowrap'
                  }}>
                    {s.replace('Group ', 'G').replace('Round of ', 'R')
                      .replace('Quarterfinal', 'QF').replace('Semifinal', 'SF').replace('🏆 FINAL', 'FINAL')}
                  </button>
                ))}
              </div>
            </div>
          </div>

          {/* ── MATCH LIST — full width ── */}
          <div style={{padding: '10px 0 90px'}}>
            {stageOrder.filter(s => grouped[s]).map(stage => (
              <div key={stage} style={{marginBottom: 14}}>
                <div style={{
                  fontSize: 10, letterSpacing: 3, color: stageColors[stage],
                  textTransform: 'uppercase', padding: '10px 16px 7px',
                  borderBottom: `1px solid ${stageColors[stage]}33`,
                  marginBottom: 2, fontWeight: 700
                }}>
                  {stage} — {grouped[stage].filter(m => done.includes(m.id)).length}/{grouped[stage].length} played
                </div>
                {grouped[stage].map(m => renderMatch(m))}
              </div>
            ))}
          </div>

          {/* ── FOOTER ── */}
          <div style={{
            position: 'fixed', bottom: 0, left: 0, right: 0,
            background: '#0a0a0f', borderTop: '1px solid #1a1a26', padding: '10px 16px'
          }}>
            <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center'}}>
              <div style={{fontSize: 10, color: '#3a3a4a'}}>{total - played} matches remaining</div>
              <div style={{fontSize: 10, color: '#252535', letterSpacing: 2}}>FIFA WC 2026 · KST</div>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<WorldCupTracker />);
  </script>
</body>
</html>
